# Qarm owner branch: automatic zero-inference checks only.
# Public standard GitHub-hosted runners are free; never run if repo becomes private.
name: Qarm Safe Checks

on:
  push:
    branches:
      - qarm/python-version-setup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qarm-safe-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-catalog:
    name: Image catalog / no inference
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore existing project CI environment
        uses: ./.github/actions/ci-environment
        with:
          uv-version: "0.12.13"
          runner-label: ubuntu-latest

      - name: Check Qarm image Python formatting and lint
        run: |
          uv run --locked --no-sync ruff check src/free_claude_code/api/qarm_image_engine.py src/free_claude_code/api/qarm_image_contracts.py src/free_claude_code/api/qarm_media_routes.py src/free_claude_code/api/qarm_search_routes.py src/free_claude_code/api/qarm_tavily.py tests/api/test_qarm_media_routes.py tests/api/test_qarm_search_routes.py tests/api/test_qarm_tavily.py
          uv run --locked --no-sync ruff format --check src/free_claude_code/api/qarm_image_engine.py src/free_claude_code/api/qarm_image_contracts.py src/free_claude_code/api/qarm_media_routes.py src/free_claude_code/api/qarm_search_routes.py src/free_claude_code/api/qarm_tavily.py tests/api/test_qarm_media_routes.py tests/api/test_qarm_search_routes.py tests/api/test_qarm_tavily.py

      - name: Test Qarm image catalog without network inference
        run: uv run --locked --no-sync pytest -q -o addopts='' tests/api/test_qarm_media_routes.py tests/api/test_qarm_search_routes.py tests/api/test_qarm_tavily.py
